name: Build & Deploy

# Baut das Cockpit und veröffentlicht es auf GitHub Pages: täglich per Zeitplan
# (frische Spieldaten und Preise für den Komponenten-Planer), bei Push auf main
# und manuell. Neben der Seite liegt das Offline-Paket SC_Cockpit_Offline.zip
# (Startdatei plus Ordner bereiche/).
#
# Die Quelle des Komponenten-Planers liegt im Repo StarCitizen-Schiffskauf-Planer
# und wird hier nach _schiffskauf ausgecheckt. Ist das Wiki oder UEX nicht
# erreichbar, baut cockpit_bauen.py die Flotte als Wegweiser und läuft weiter.
on:
  schedule:
    - cron: "20 5 * * *"   # täglich 05:20 UTC, nach dem Schiffskauf-Planer
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Jaegerfeld/StarCitizen-Schiffskauf-Planer
          path: _schiffskauf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cockpit bauen (cockpit/ und Offline-Paket)
        run: python cockpit_bauen.py --zip
      - name: Pages-Verzeichnis vorbereiten
        run: |
          mkdir -p _site
          cp cockpit/SC_Cockpit.html _site/index.html
          cp -r cockpit/bereiche _site/bereiche
          cp SC_Cockpit_Offline.zip _site/SC_Cockpit_Offline.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

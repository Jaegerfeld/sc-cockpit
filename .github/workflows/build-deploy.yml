name: Build & Deploy

# Baut das Cockpit und veröffentlicht es auf GitHub Pages: bei Push auf main
# und manuell. Der Bau braucht kein Netz. Neben der Seite liegt das
# Offline-Paket SC_Cockpit_Offline.zip (Startdatei plus Ordner bereiche/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cockpit bauen (cockpit/ und Offline-Paket)
        run: python cockpit_bauen.py --zip
      - name: Pages-Verzeichnis vorbereiten
        run: |
          mkdir -p _site
          cp cockpit/SC_Cockpit.html _site/index.html
          cp -r cockpit/bereiche _site/bereiche
          cp SC_Cockpit_Offline.zip _site/SC_Cockpit_Offline.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
